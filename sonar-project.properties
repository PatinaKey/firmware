# SonarQube configuration for the PatinaKey firmware.
# The CI produces the referenced reports at the repository root
# (see .github/workflows/ci.yml and scripts/ci-local.sh).

sonar.projectKey=PatinaKey_firmware
sonar.projectName=PatinaKey Firmware
sonar.organization=patinakey
sonar.sourceEncoding=UTF-8

sonar.sources=crates
sonar.exclusions=**/target/**,**/fuzz/corpus/**,**/fuzz/artifacts/**

sonar.language=rust
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippy.reportPaths=clippy-report.json
sonar.sarifReportPaths=cargo-audit.sarif

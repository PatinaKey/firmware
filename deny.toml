# cargo-deny policy for the PatinaKey firmware.

[advisories]
yanked = "deny"

[licenses]
allow = [
    # The workspace itself.
    "GPL-3.0-or-later",
    # The audited crypto and embedded ecosystem.
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates depend on each other by path, which cargo-deny counts as
# a wildcard requirement. Those internal path dependencies are legitimate and
# resolved inside the workspace, so allow them. An external wildcard dependency
# stays denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

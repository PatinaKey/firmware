# cargo-deny policy for the PatinaKey firmware.

[advisories]
yanked = "deny"
# bare-metal is unmaintained (RUSTSEC-2026-0110, every version is flagged, no
# patched or unaffected release exists). It reaches the tree ONLY transitively
# through cortex-m 0.7.7, the latest cortex-m release, which depends on it
# non-optionally.
# There is no upstream fix until a cortex-m release drops bare-metal.
# It is an unmaintained advisory (informational), not a vulnerability.
# TODO: drop this ignore once a cortex-m release removes the bare-metal
#       dependency.
ignore = ["RUSTSEC-2026-0110"]

[licenses]
allow = [
    # The workspace itself.
    "GPL-3.0-or-later",
    # The audited crypto and embedded ecosystem.
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates depend on each other by path, which cargo-deny counts as
# a wildcard requirement. Those internal path dependencies are legitimate and
# resolved inside the workspace, so allow them. An external wildcard dependency
# stays denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

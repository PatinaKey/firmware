# CI/CD pipeline for the PatinaKey firmware.
#
# Deliberate choices for this security-critical no_std codebase:
# - NO rustfmt: the project uses a strict hand-written Allman style that
#   rustfmt cannot reproduce. Style is reviewed, not auto-formatted.
# - Host job runs cargo test on the whole workspace against mock ports.
# - Embedded job builds the real firmware for thumbv8m: it lints every embedded
#   library on the target, then runs the two-image TrustZone build across the
#   feature matrix (default, se-session, se-fw-update). The secure crate MUST
#   link before the non-secure crate so its CMSE import object exists, so the
#   order is enforced and the shared object is forced to regenerate per feature.
#   An asm gate disassembles the built images and asserts the hand-rolled
#   inline asm compiled to the right instructions, since no host lint sees it.
# - The host signing tool is a detached workspace, so it has its own job.
# - Live model integration: the coverage job clones libtropic (pinned to a tag +
#   commit) for the model config, installs the ts-tvl wheel pinned by
#   crates/tropic01-driver/scripts/install-model.sh, and drives tropic01-driver
#   against it end-to-end (real handshake + AES-GCM). These run under coverage so
#   the library paths they exercise count. The test-harness files are excluded.
# - cargo-deny BLOCKS on findings (it now also covers the RustSec advisory DB
#   that cargo-audit used to check, making a separate audit job redundant): a
#   known vulnerability, a banned or yanked crate, a disallowed license, or an
#   untrusted source must stop the line.
#
# Reports for SonarQube (see sonar-project.properties):
#   clippy-report.json   clippy lints, raw cargo JSON
#   lcov.info            line coverage from cargo-llvm-cov
#   cargo-deny.sarif     advisories/licenses/bans/sources findings, native SARIF

name: 'CI/CD Pipeline PatinaKey'

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly deep run: long fuzz pass and a fresh advisory database.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Official libtropic, pinned to a release tag and its commit. Shared by the
  # coverage job (the TROPIC01 model config and venv layout) and the embedded
  # job (the se-fw-update vendor blobs).
  LIBTROPIC_REF: v4.0.0
  LIBTROPIC_SHA: 756c8ee898ed61b12272ecb22b213edf97aab751

jobs:
  # Job 1: Host check and lint (whole workspace on the host)
  lint:
    name: Check & Lint (host)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: '-D warnings'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo Check (host, whole workspace)
        run: cargo check --workspace --locked --all-targets

      - name: Generate Clippy report
        run: |
          cargo clippy \
            --workspace \
            --locked \
            --all-targets \
            --all-features \
            --message-format=json \
            > clippy-report.json || true

      - name: Run Clippy (strict, host)
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Upload Clippy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-report
          path: clippy-report.json

  # Job 2: Embedded build and lint (thumbv8m, the real firmware)
  embedded:
    name: Embedded build (thumbv8m)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        feature: [default, se-session, se-fw-update]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
          components: clippy, llvm-tools

      # The secure crate's build.rs compiles the C -mcmse NSC veneer shim with
      # clang and emits the CMSE import object with rust-lld. clang ships on the
      # runner, rust-lld ships with the toolchain.
      - name: Verify the CMSE C toolchain
        run: clang --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-embedded-${{ matrix.feature }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Lint the embedded libraries on the target
        if: matrix.feature == 'default'
        run: |
          set -euo pipefail
          for c in mcu-layout platform mcu-arch mcu-spi mcu-flash image-verify fw-update tropic01-driver
          do
            cargo clippy -p "$c" --locked --target thumbv8m.main-none-eabihf -- -D warnings
          done

      # se-fw-update embeds two Tropic Square signed firmware blobs that are
      # gitignored (vendor artifacts, not part of the source). Fetch them from
      # the pinned libtropic so the update path still compile-checks.
      - name: Fetch the vendor firmware blobs
        if: matrix.feature == 'se-fw-update'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/libtropic"
          git clone --depth 1 --branch "$LIBTROPIC_REF" \
            https://github.com/tropicsquare/libtropic "$src"
          got="$(git -C "$src" rev-parse HEAD)"
          if [ "$got" != "$LIBTROPIC_SHA" ]; then
            echo "libtropic $LIBTROPIC_REF moved: expected $LIBTROPIC_SHA, got $got" >&2
            exit 1
          fi
          cpu="$(find "$src" -name 'fw_v2.0.0.hex32_signed_chunks.bin' | head -1)"
          spect="$(find "$src" -name 'spect_app-v1.0.0_signed_chunks.bin' | head -1)"
          if [ -z "$cpu" ] || [ -z "$spect" ]; then
            echo "vendor firmware blobs not found in libtropic $LIBTROPIC_REF" >&2
            exit 1
          fi
          mkdir -p crates/secure/fw_blobs
          cp "$cpu" crates/secure/fw_blobs/cpu_fw_2_0_0.bin
          cp "$spect" crates/secure/fw_blobs/spect_fw_1_0_0.bin

      - name: Two-stage TrustZone build
        run: |
          set -euo pipefail
          feat=()
          if [ "${{ matrix.feature }}" != "default" ]; then
            feat=(--features "${{ matrix.feature }}")
          fi
          # Force the shared CMSE import object to regenerate for THIS feature
          # set. A cached secure build otherwise leaves a stale import object and
          # the non-secure link fails with undefined veneer symbols.
          touch crates/secure/csrc/secure_nsc.c
          echo ">> build secure (${{ matrix.feature }})"
          cargo build -p secure    --locked --release --target thumbv8m.main-none-eabihf "${feat[@]}"
          echo ">> build nonsecure (${{ matrix.feature }})"
          cargo build -p nonsecure --locked --release --target thumbv8m.main-none-eabihf "${feat[@]}"

      - name: Lint the secure and non-secure images on the target
        run: |
          set -euo pipefail
          feat=()
          if [ "${{ matrix.feature }}" != "default" ]; then
            feat=(--features "${{ matrix.feature }}")
          fi
          cargo clippy -p secure    --locked --release --target thumbv8m.main-none-eabihf "${feat[@]}" -- -D warnings
          cargo clippy -p nonsecure --locked --release --target thumbv8m.main-none-eabihf "${feat[@]}" -- -D warnings

      # This disassembles the images just built and asserts the critical instructions are
      # what they must be (the cpsid/cpsie masking pair, the dsb/isb/bxns boot
      # order, the delay countdown loop).
      - name: Assert the emitted machine code (asm gate)
        run: scripts/asm-gate.sh "${{ matrix.feature }}"

  # Job 3: Host signing tool (detached workspace)
  image-signer:
    name: Host tool (image-signer)
    runs-on: ubuntu-latest
    needs: lint
    env:
      RUSTFLAGS: '-D warnings'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            tools/image-signer/target
          key: ${{ runner.os }}-cargo-signer-${{ hashFiles('tools/image-signer/Cargo.lock') }}

      - name: Test the signing tool
        run: cargo test --locked --manifest-path tools/image-signer/Cargo.toml

      - name: Lint the signing tool
        run: cargo clippy --locked --manifest-path tools/image-signer/Cargo.toml --all-targets -- -D warnings

  # Job 4: Tests & coverage (host, whole workspace + live model)
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests (host, hermetic, whole workspace)
        run: cargo test --workspace --locked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure model location
        run: echo "LIBTROPIC=$RUNNER_TEMP/libtropic" >> "$GITHUB_ENV"

      - name: Clone the model config (libtropic, pinned)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LIBTROPIC_REF" \
            https://github.com/tropicsquare/libtropic "$LIBTROPIC"
          got="$(git -C "$LIBTROPIC" rev-parse HEAD)"
          if [ "$got" != "$LIBTROPIC_SHA" ]; then
            echo "libtropic $LIBTROPIC_REF moved: expected $LIBTROPIC_SHA, got $got" >&2
            exit 1
          fi

      - name: Install the TROPIC01 model (ts-tvl, pinned)
        run: crates/tropic01-driver/scripts/install-model.sh

      # Coverage over the hermetic suite PLUS the live model integration tests
      # (tests/model_itest.rs, behind `model-itest`): the driver runs its real
      # Noise KK1 handshake + AES-GCM against the model in the background. The
      # library paths they exercise count toward coverage. The test-harness
      # files (tests/) are excluded so only library coverage is measured.
      # Single-threaded: the model is one stateful target.
      - name: Run coverage (host + live model)
        run: |
          set -euo pipefail
          MODEL="$LIBTROPIC/scripts/tropic01_model"
          "$MODEL/.venv/bin/model_server" tcp -c "$MODEL/model_cfg.yml" \
            -o "$RUNNER_TEMP/model-config-save.yml" \
            > "$RUNNER_TEMP/model-server.log" 2>&1 &
          srv=$!
          trap 'kill "$srv" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 50); do
            if (exec 3<>/dev/tcp/127.0.0.1/28992) 2>/dev/null; then
              exec 3>&- 3<&-
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ]; then
            echo "model_server did not become ready on 127.0.0.1:28992" >&2
            exit 1
          fi
          cargo llvm-cov --workspace --locked --features model-itest \
            --ignore-filename-regex 'tests/' \
            --lcov --output-path lcov.info -- --test-threads=1

      # Raise this floor as the crates grow.
      - name: Enforce coverage floor
        run: cargo llvm-cov report --ignore-filename-regex 'tests/' --fail-under-lines 90

      - name: Show model server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/model-server.log" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  # Job 5: Dependency policy (cargo-deny, udeps, outdated)
  #
  # cargo-deny now also owns the advisory gate that cargo-audit used to run:
  # `deny check` runs the advisories check against the same RustSec database,
  # so the standalone audit job has been removed as redundant. This job also
  # exports the deny findings as SARIF for SonarQube.
  dependencies:
    name: Dependency Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust toolchain (nightly, for udeps)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependency tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-udeps,cargo-outdated

      # Advisories (RustSec), licenses, banned/yanked crates, untrusted
      # sources, duplicate versions. `check` runs all of these and blocks on
      # any of them. Export SARIF for SonarQube first, non-blocking, so the
      # readable human-format gate below is the step that actually fails the
      # job (clean CI logs); then run the blocking gate.
      - name: Cargo Deny (SARIF export for SonarQube)
        run: cargo +stable deny --format sarif check > cargo-deny.sarif || true

      - name: Cargo Deny (blocking gate)
        run: cargo +stable deny check

      - name: Upload deny report (SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deny-report
          path: cargo-deny.sarif

      # Unused dependencies are dead audit surface on a security product.
      - name: Cargo Udeps (nightly)
        run: cargo +nightly udeps --workspace --all-targets --locked

      # Informational only: an upstream release must never break our CI.
      # The weekly scheduled run keeps this visible.
      - name: Cargo Outdated (informational)
        continue-on-error: true
        run: cargo +stable outdated --workspace --root-deps-only

  # Job 6: Fuzzing (libFuzzer + ASan on the driver's attacker-facing parsers)
  fuzz:
    name: Fuzz Parsers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # The corpus accumulates across runs: every discovered input makes
      # the next run start deeper.
      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: crates/tropic01-driver/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      # 60 seconds per target on PR/push, 15 minutes on the weekly run.
      - name: Fuzz each target
        run: |
          secs=60
          if [ "${{ github.event_name }}" = "schedule" ]; then secs=900; fi
          cd crates/tropic01-driver
          # Enumerate the targets so a newly added one is fuzzed automatically.
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$t" --target x86_64-unknown-linux-gnu -- -max_total_time="$secs" -timeout=10
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/tropic01-driver/fuzz/artifacts

  # Job 7: SonarQube Analysis
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test, dependencies]
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Download Clippy report
        uses: actions/download-artifact@v4
        with:
          name: clippy-report

      - name: Download Deny report
        uses: actions/download-artifact@v4
        with:
          name: deny-report

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
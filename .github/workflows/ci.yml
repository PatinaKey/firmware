# CI/CD pipeline for the PatinaKey firmware.
#
# Deliberate choices for this security-critical no_std codebase:
# - NO rustfmt: the project uses a strict hand-written Allman style that
#   rustfmt cannot reproduce. Style is reviewed, not auto-formatted.
# - Host tests + target builds: `cargo test` runs on the host against mock
#   ports. The bare-metal target has no std, no test harness, and no runner,
#   so the thumbv8m job proves the no_std build and lints it instead.
#   On-hardware tests (probe-rs) become a separate job once boards exist.
# - Live model integration: the coverage job clones the official TROPIC01 model
#   (libtropic, pinned to a tag + commit) and drives tropic01-driver against it
#   end-to-end (real handshake + AES-GCM). These run under coverage so the
#   library paths they exercise count. The test-harness files are excluded.
# - cargo audit BLOCKS on findings (no `|| true` on the gate): a known
#   vulnerability in the dependency tree must stop the line.
#
# Reports for SonarQube (see sonar-project.properties):
#   clippy-report.json   clippy lints, raw cargo JSON
#   lcov.info            line coverage from cargo-llvm-cov
#   cargo-audit.sarif    advisory findings, native SARIF export

name: 'CI/CD Pipeline PatinaKey'

on:
  push:
  pull_request:
  schedule:
    # Weekly deep run: long fuzz pass and a fresh advisory database.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Job 1: Check & Linting (host + firmware target)
  lint:
    name: Check & Lint
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: '-D warnings'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo Check (Host)
        run: cargo check --workspace --locked --all-targets

      - name: Cargo Check (Firmware target, no_std proof)
        run: cargo check -p tropic01-driver --locked --target thumbv8m.main-none-eabihf

      - name: Generate Clippy report
        run: |
          cargo clippy \
            --workspace \
            --locked \
            --all-targets \
            --all-features \
            --message-format=json \
            > clippy-report.json || true

          cargo clippy \
            -p tropic01-driver \
            --locked \
            --target thumbv8m.main-none-eabihf \
            --message-format=json \
            >> clippy-report.json || true

      - name: Run Clippy (strict)
        run: |
          cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
          cargo clippy -p tropic01-driver --locked --target thumbv8m.main-none-eabihf -- -D warnings

      - name: Upload Clippy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-report
          path: clippy-report.json

  # Job 2: Tests & coverage (host)
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    needs: lint
    env:
      # Official TROPIC01 model (libtropic), pinned to a release tag AND its
      # commit so the test vectors cannot drift if the tag is ever moved.
      LIBTROPIC_REF: v4.0.0
      # Commit the annotated tag v4.0.0 dereferences to (git rev-parse HEAD after
      # checkout), NOT the tag-object hash.
      LIBTROPIC_SHA: 756c8ee898ed61b12272ecb22b213edf97aab751

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests (Host, hermetic)
        run: cargo test --workspace --locked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure model location
        run: echo "LIBTROPIC=$RUNNER_TEMP/libtropic" >> "$GITHUB_ENV"

      - name: Clone the TROPIC01 model (libtropic, pinned)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LIBTROPIC_REF" \
            https://github.com/tropicsquare/libtropic "$LIBTROPIC"
          got="$(git -C "$LIBTROPIC" rev-parse HEAD)"
          if [ "$got" != "$LIBTROPIC_SHA" ]; then
            echo "libtropic $LIBTROPIC_REF moved: expected $LIBTROPIC_SHA, got $got" >&2
            exit 1
          fi

      - name: Install the TROPIC01 model (ts-tvl)
        run: "$LIBTROPIC/scripts/tropic01_model/install_linux.sh"

      # Coverage over the hermetic suite PLUS the live model integration tests
      # (tests/model_itest.rs, behind `model-itest`): the driver runs its real
      # Noise KK1 handshake + AES-GCM against the model in the background. The
      # library paths they exercise count toward coverage. The test-harness
      # files (tests/) are excluded so only library coverage is measured.
      # Single-threaded: the model is one stateful target.
      - name: Run coverage (host + live model)
        run: |
          set -euo pipefail
          MODEL="$LIBTROPIC/scripts/tropic01_model"
          "$MODEL/.venv/bin/model_server" tcp -c "$MODEL/model_cfg.yml" \
            -o "$RUNNER_TEMP/model-config-save.yml" \
            > "$RUNNER_TEMP/model-server.log" 2>&1 &
          srv=$!
          trap 'kill "$srv" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 50); do
            if (exec 3<>/dev/tcp/127.0.0.1/28992) 2>/dev/null; then
              exec 3>&- 3<&-
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ]; then
            echo "model_server did not become ready on 127.0.0.1:28992" >&2
            exit 1
          fi
          cargo llvm-cov --workspace --locked --features model-itest \
            --ignore-filename-regex 'tests/' \
            --lcov --output-path lcov.info -- --test-threads=1

      # Raise this floor as the crate grows.
      - name: Enforce coverage floor
        run: cargo llvm-cov report --ignore-filename-regex 'tests/' --fail-under-lines 90

      - name: Show model server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/model-server.log" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  # Job 4: Security audit (RustSec advisories, blocking)
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      # Export the SARIF report first, then fail the job on findings.
      # cargo audit exits non-zero on a vulnerability, so capture the
      # status instead of discarding it with `|| true`.
      - name: Run security audit (SARIF, blocking)
        run: |
          status=0
          cargo audit --format sarif > cargo-audit.sarif || status=$?
          exit $status

      - name: Upload audit report (SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: cargo-audit.sarif

  # Job 5: Dependency policy (cargo-deny, udeps, outdated)
  dependencies:
    name: Dependency Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust toolchain (nightly, for udeps)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependency tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-udeps,cargo-outdated

      # Licenses, yanked crates, untrusted sources, duplicate versions.
      - name: Cargo Deny
        run: cargo +stable deny check

      # Unused dependencies are dead audit surface on a security product.
      - name: Cargo Udeps (nightly)
        run: cargo +nightly udeps --workspace --all-targets --locked

      # Informational only: an upstream release must never break our CI.
      # The weekly scheduled run keeps this visible.
      - name: Cargo Outdated (informational)
        continue-on-error: true
        run: cargo +stable outdated --workspace --root-deps-only

  # Job 6: Fuzzing (libFuzzer + ASan on the attacker-facing parsers)
  fuzz:
    name: Fuzz Parsers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # The corpus accumulates across runs: every discovered input makes
      # the next run start deeper.
      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: crates/tropic01-driver/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      # 60 seconds per target on PR/push, 15 minutes on the weekly run.
      - name: Fuzz each target
        run: |
          secs=60
          if [ "${{ github.event_name }}" = "schedule" ]; then secs=900; fi
          cd crates/tropic01-driver
          # Enumerate the targets so a newly added one is fuzzed automatically.
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$t" --target x86_64-unknown-linux-gnu -- -max_total_time="$secs" -timeout=10
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/tropic01-driver/fuzz/artifacts

  # Job 7: SonarQube Analysis
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test, security]
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Download Clippy report
        uses: actions/download-artifact@v4
        with:
          name: clippy-report

      - name: Download Audit report
        uses: actions/download-artifact@v4
        with:
          name: audit-report

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

[package]
name = "image-signer"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
authors = ["PatinaKey <contact@patinakey.fr>"]
license = "GPL-3.0-or-later"
description = "Host-only tool that signs patina_key firmware images with an ECDSA P-256 key."
publish = false

# Detach from the firmware workspace: this is a HOST tool, never built for the
# MCU target and never a member of the firmware workspace. An empty [workspace]
# table makes it its own root, like the fuzz crate.
[workspace]

[lib]
name = "image_signer"
path = "src/lib.rs"

[[bin]]
name = "image-signer"
path = "src/main.rs"

[dependencies]
# The shared on-wire layout. The `encode` feature gives the SINGLE source of
# truth for the header bytes, and verify_image gives the round-trip self-check.
image-verify = { path = "../../crates/image-verify", features = ["encode"] }

# ECDSA P-256 signing from a raw 32-byte private scalar.
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }

# Enable DER support for `ecdsa::Signature::from_der`.
ecdsa = { version = "0.17", default-features = false, features = ["der"] }

# Wipes the intermediate plaintext seed buffer on drop.
# The alloc feature lets a Vec<u8> seed buffer be wiped too.
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

# SHA-256 for deriving the bring-up root key.
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
# The integration tests verify the signed output through the real verify path,
# so they read it back exactly as the device would.
image-verify = { path = "../../crates/image-verify", features = ["encode"] }

# Derive the bring-up root key from the fixed test phrase instead of embedding
# the expected key bytes.
sha2 = { version = "0.11", default-features = false }

# Expose the host test interfaces used by the end-to-end signer tests.
fw-update = { path = "../../crates/fw-update", features = ["_fuzz"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "deny"

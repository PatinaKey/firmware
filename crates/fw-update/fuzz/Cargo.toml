[package]
name = "fw-update-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Detach from the firmware workspace: the fuzz crate is a standalone, nightly,
# instrumented build and must not be a workspace member.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.fw-update]
path = ".."
features = ["_fuzz"]

[[bin]]
name = "drive_machine"
path = "fuzz_targets/drive_machine.rs"
test = false
doc = false
bench = false

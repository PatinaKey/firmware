[package]
name = "platform"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "STM32U545 MCU platform foundation: TrustZone (SAU/GTZC) runtime partition bring-up."

[dependencies]

# This crate must touch raw MMIO (the volatile register reads/writes that program SAU/GTZC).
# Every unsafe block must carry a `// SAFETY:` justification.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "deny"

[package]
name = "image-verify-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Detach from the firmware workspace: the fuzz crate is a standalone, nightly,
# instrumented build and must not be a workspace member.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.image-verify]
path = ".."
features = ["_fuzz"]

[[bin]]
name = "verify_image"
path = "fuzz_targets/verify_image.rs"
test = false
doc = false
bench = false
